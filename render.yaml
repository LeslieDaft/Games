services:
  - type: web
    name: northline-multiplayer
    runtime: node
    rootDir: northline
    plan: starter
    buildCommand: npm ci --prefix server
    startCommand: node server/server.mjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
